name: code-only-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python scripts/verify_repository.py
      - run: python scripts/verify_code_only_release.py
      - run: python -m unittest discover -s analysis/tests -v
      - run: python -m unittest discover -s revision/code -p 'test_*.py' -v
      - run: python -m unittest discover -s revision/tests -p 'test_*.py' -v
  # Code-only CI runs synthetic/portable tests; research-data reproduction is not claimed.
